name: CI-Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # 统一设置默认运行目录，下方所有的 run 步骤都不用再单独写 working-directory 了
    defaults:
      run:
        working-directory: frontend/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend/app
        # 提示：如果你的仓库很大，可以用 sparse-checkout 只拉取前端目录，速度会更快

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          # 这里要写相对于仓库根目录的完整路径，因为 setup-node 不受 defaults.run 的影响
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Lint Check
        run: pnpm run lint

      # - name: Run Tests
      #   run: pnpm run test

      - name: Build Check
        run: pnpm run build