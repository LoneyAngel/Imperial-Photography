name: CI-Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. 安装 pnpm（必须在 setup-node 之前）
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # npm 模式下，直接指定 cache 为 npm
          cache: 'pnpm'
          # 告诉 GitHub 去哪里找 package-lock.json
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        # npm ci 相当于 pnpm install --frozen-lockfile
        # 它专门用于 CI 环境，速度更快且保证版本一致
        run: pnpm ci
        working-directory: frontend/app

      - name: Lint Check
        run: pnpm run lint
        working-directory: frontend/app

      - name: Run Tests
        run: pnpm run test
        working-directory: frontend/app

      - name: Build Check
        run: pnpm run build
        working-directory: frontend/app